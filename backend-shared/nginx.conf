# Kevaks edge config — include from the nginx `http {}` block, or drop it into
# /etc/nginx/conf.d/ (which is included from `http {}` by default).
#
#   api.kevaks.com -> Go API  (host port 7696)
#   lk.kevaks.com  -> LiveKit (host port 7880, signalling only)

# Correct Connection header for both plain and upgraded requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# --- api.kevaks.com ---------------------------------------------------------

server {
    listen      80;
    listen      [::]:80;
    server_name api.kevaks.com;

    # Let's Encrypt HTTP-01 challenges (webroot). Kept in a location so the
    # server-level-less redirect below does not swallow them.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.kevaks.com;

    ssl_certificate     /etc/letsencrypt/live/api.kevaks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kevaks.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:7696;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # /games/trivia/ws is a WebSocket; long timeouts keep it open.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}

# --- lk.kevaks.com ----------------------------------------------------------
# Signalling only (WebSocket /rtc + HTTP/Twirp API on 7880). Media never passes
# through nginx: see the note at the bottom of this file.

server {
    listen      80;
    listen      [::]:80;
    server_name lk.kevaks.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name lk.kevaks.com;

    ssl_certificate     /etc/letsencrypt/live/lk.kevaks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.kevaks.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}

# WebRTC media cannot be proxied here:
#   7882/udp — raw UDP, and stock nginx has no UDP proxying at all.
#   7881/tcp — raw TLS/TCP to the ICE candidate, not HTTP. Routing it through
#              nginx needs a `stream {}` block (a separate top-level context),
#              plus LiveKit configured to advertise that endpoint.
# Keep 7881/tcp and 7882/udp published directly from Docker and open them in the
# firewall. With TLS terminated above, point the app at the public signalling
# URL:
#
#   LIVEKIT_CLIENT_URL=wss://lk.kevaks.com
#
# while LIVEKIT_URL stays http://livekit:7880 (container-to-container).
